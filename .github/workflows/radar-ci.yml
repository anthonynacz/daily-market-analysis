name: Momentum Radar CI

on:
  push:
    branches-ignore: [data]    # the scanner pushes the data branch ~80 times a day; never build it
    paths: ['radar/**', '.github/workflows/**']
  pull_request:
    paths: ['radar/**', '.github/workflows/**']

permissions:
  contents: read

concurrency:
  group: radar-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: radar/requirements.lock

      - name: Install pinned dependencies
        run: python -m pip install --disable-pip-version-check --require-hashes -r radar/requirements.lock

      - name: Tests (no network; live tests need RADAR_LIVE=1)
        run: python -m pytest radar/tests -q
