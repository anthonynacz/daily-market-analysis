name: Momentum Radar CI

on:
  push:
    branches-ignore: [data]    # the scanner pushes the data branch ~80 times a day; never build it
    paths: ['radar/**', 'radar.html', '.github/workflows/**']
  pull_request:
    paths: ['radar/**', 'radar.html', '.github/workflows/**']
  workflow_dispatch:           # runs the soak job
  schedule:
    - cron: '17 6 * * 0'       # soak job, Sundays 06:17 UTC: no scan window, after the 03:30 housekeeping

permissions:
  contents: read

concurrency:
  # A push must not cancel a running soak on the same ref, nor the other way round.
  group: radar-ci-${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'soak' || 'test' }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: radar/requirements.lock

      - name: Install pinned dependencies
        run: python -m pip install --disable-pip-version-check --require-hashes -r radar/requirements.lock

      - name: Tests (no network, no soak; live tests need RADAR_LIVE=1)
        run: python -m pytest radar/tests -q -m "not soak"

  soak:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: radar/requirements.lock

      - name: Install pinned dependencies
        run: python -m pip install --disable-pip-version-check --require-hashes -r radar/requirements.lock

      - name: Soak tests (full 120-day git soak)
        env:
          RADAR_SOAK: '1'
        run: python -m pytest radar/tests -q -m soak
