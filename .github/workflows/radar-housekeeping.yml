name: Momentum Radar housekeeping

# Measures every radar table, archives degraded ones to monthly backups on the data branch, applies the
# 3-calendar-month retention and squashes the data branch (radar/SPEC.md 8, radar/docs/storage.md).
# The scanner never waits on this workflow: both write the data branch with compare-and-swap pushes
# (SPEC 7), so the concurrency group below only keeps two housekeeping runs apart.
on:
  schedule:
    - cron: '30 3 * * *'        # 03:30 UTC = 23:30 EDT / 22:30 EST: scanner idle, inside the squash window
  workflow_dispatch:            # manual, and the scanner's rate-limited request (mode=apply, squash=skip)
    inputs:
      mode:
        description: 'apply = archive, trim and publish; dry-run = measure and plan only, writes nothing'
        type: choice
        options: [apply, dry-run]
        default: apply
      squash:
        description: 'auto = 02:00-07:00 UTC or weekends; the calendar and running-scanner guards always apply'
        type: choice
        options: [auto, force, skip]
        default: auto
      force_archive:
        description: 'Space-separated tables to archive even when OK (member_ticks events scan_log table_metrics housekeeping_runs alerts_log)'
        type: string
        default: ''
      reason:
        description: 'Why this run was started (shown in the job summary)'
        type: string
        default: 'manual'

permissions:
  contents: write              # push the data branch; trim main:alerts/log.json through the contents API
  actions: read                # squash guard: is a radar-scan.yml run in progress?

concurrency:
  group: radar-housekeeping    # never shared with the scanner (storage.md 4.3)
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  housekeeping:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONUNBUFFERED: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      MODE: ${{ inputs.mode || 'apply' }}
      SQUASH: ${{ inputs.squash || 'auto' }}
      FORCE_ARCHIVE: ${{ inputs.force_archive }}
      REASON: ${{ inputs.reason || github.event_name }}
    steps:
      - name: Check out radar code (main)
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: main
          persist-credentials: false # main is only written through the contents API
          sparse-checkout: radar

      - name: Check out data branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: data
          path: _data
          fetch-depth: 0             # full history (about one day after a squash): commit count and bundle

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: radar/requirements.lock

      - name: Install pinned dependencies
        run: python -m pip install --disable-pip-version-check --require-hashes -r radar/requirements.lock

      - name: Safety bundle of the data branch (artifact kept 7 days)
        if: env.MODE == 'apply'
        run: git -C _data bundle create "$RUNNER_TEMP/data-pre.bundle" HEAD refs/heads/data

      - name: Housekeeping
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          read -ra tables <<< "${FORCE_ARCHIVE//,/ }"   # inputs reach the shell only through env
          python -m radar.storage.housekeeping_job \
            --data-dir _data --main-repo "$GITHUB_REPOSITORY" \
            --mode "$MODE" --squash "$SQUASH" \
            --force-archive "${tables[@]}" \
            --reason "$REASON" \
            --report "$RUNNER_TEMP/hk-report.json"

      - name: Upload report and safety bundle
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: housekeeping-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/hk-report.json
            ${{ runner.temp }}/data-pre.bundle
          retention-days: 7
          if-no-files-found: ignore
