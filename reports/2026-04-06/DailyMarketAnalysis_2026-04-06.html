<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>US Market Pulse — Recency × Impact Matrix</title>
<style>
  html, body { margin: 0; background: #0b0f1a; }
  body { padding: 16px; -webkit-text-size-adjust: 100%; }
  #root { max-width: 1000px; margin: 0 auto; }
  .boot { color:#64748b; font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; text-align:center; padding:40px 16px; font-size:14px; }
  .err  { color:#f87171; font-family:ui-monospace,monospace; white-space:pre-wrap; padding:16px; font-size:12px; }
  .retry { background:#818cf8; color:#0b0f1a; border:0; border-radius:8px; padding:10px 22px; font-size:14px; font-weight:700; cursor:pointer; }
  .alerts-link { position:fixed; right:14px; bottom:14px; z-index:50; background:#151c2c; color:#c7d2fe; border:1px solid #334155;
    border-radius:999px; padding:8px 14px; font:600 13px system-ui,-apple-system,Segoe UI,Roboto,sans-serif; text-decoration:none;
    box-shadow:0 4px 14px rgba(0,0,0,.45); }
  .float-links { position:fixed; right:14px; bottom:14px; z-index:50; display:flex; gap:8px; }
  .float-links .alerts-link { position:static; }
</style>
</head>
<body>
<div id="root"><div class="boot">Loading market matrix…</div></div>
<nav class="float-links"><a class="alerts-link" href="../../radar.html">📡 Radar</a><a class="alerts-link" href="../../alerts.html">🔔 Alerts</a></nav>
<script id="jsx-source" type="text/plain">
const { useState, useMemo } = React;

const INDUSTRY_COLORS = {
  Tech: '#818cf8',
  Healthcare: '#34d399',
  Energy: '#fbbf24',
  Finance: '#fb7185',
};

const EVENTS = [
  { id: 1, headline: 'Tesla Q1 Deliveries Miss Estimates, Shares Drop 5%', industry: 'Tech', date: '2026-04-02', impact: 'High', ticker: 'TSLA', recommendation: 'HOLD', reason: 'Delivery miss already priced in; wait for earnings clarity on Apr 20.' },
  { id: 2, headline: 'Netflix Upgraded to Buy by Goldman Sachs', industry: 'Tech', date: '2026-04-03', impact: 'Medium', ticker: 'NFLX', recommendation: 'BUY', reason: 'Analyst upgrade reflects strong subscriber growth and ad-tier momentum.' },
  { id: 3, headline: 'Alphabet Q1 Earnings Report Due Apr 22', industry: 'Tech', date: '2026-04-22', impact: 'High', ticker: 'GOOGL', recommendation: 'WATCH', reason: 'AI monetization progress will be the key catalyst to monitor.' },
  { id: 4, headline: 'Microsoft Q1 Earnings Report Due Apr 28', industry: 'Tech', date: '2026-04-28', impact: 'High', ticker: 'MSFT', recommendation: 'WATCH', reason: 'Azure cloud growth and Copilot revenue will drive sentiment.' },
  { id: 5, headline: 'Apple Q1 Earnings Report Due Apr 30', industry: 'Tech', date: '2026-04-30', impact: 'High', ticker: 'AAPL', recommendation: 'HOLD', reason: 'iPhone demand in China remains uncertain amid geopolitical tensions.' },
  { id: 6, headline: 'UnitedHealth Upcoming Earnings Mid-April', industry: 'Healthcare', date: '2026-04-15', impact: 'Medium', ticker: 'UNH', recommendation: 'HOLD', reason: 'Steady managed-care demand but regulatory headwinds persist.' },
  { id: 7, headline: 'Johnson & Johnson Earnings Expected Mid-April', industry: 'Healthcare', date: '2026-04-16', impact: 'Medium', ticker: 'JNJ', recommendation: 'BUY', reason: 'Diversified pharma portfolio and MedTech growth provide resilience.' },
  { id: 8, headline: 'Iran Ceasefire Talks Push Oil Prices Lower', industry: 'Energy', date: '2026-04-06', impact: 'High', ticker: 'XOM', recommendation: 'HOLD', reason: 'Ceasefire could ease crude premiums; wait for confirmation before acting.' },
  { id: 9, headline: 'Crude Oil Surges to $111.54/Barrel on Supply Fears', industry: 'Energy', date: '2026-04-03', impact: 'High', ticker: 'CVX', recommendation: 'BUY', reason: 'Elevated oil prices support strong upstream margins for majors.' },
  { id: 10, headline: 'APA Corp Rallies 4.3% on Energy Momentum', industry: 'Energy', date: '2026-04-02', impact: 'Medium', ticker: 'APA', recommendation: 'BUY', reason: 'Geopolitical premium and production growth support further upside.' },
  { id: 11, headline: 'Diamondback Energy Gains 3% Amid Sector Rally', industry: 'Energy', date: '2026-04-02', impact: 'Medium', ticker: 'FANG', recommendation: 'BUY', reason: 'Permian Basin efficiency leader benefits from high crude prices.' },
  { id: 12, headline: 'March Jobs Report Blows Past Expectations: 178K vs 60K', industry: 'Finance', date: '2026-04-04', impact: 'High', ticker: 'SPY', recommendation: 'BUY', reason: 'Strong labor market signals economic resilience despite war uncertainty.' },
  { id: 13, headline: 'Nike Shares Slide After Multiple Price Target Cuts', industry: 'Finance', date: '2026-04-02', impact: 'Medium', ticker: 'NKE', recommendation: 'SELL', reason: 'Broad Wall Street downgrades signal sustained headwinds in consumer demand.' },
  { id: 14, headline: 'Cruise Lines Drop ~4% on Travel Demand Concerns', industry: 'Finance', date: '2026-04-03', impact: 'Medium', ticker: 'CCL', recommendation: 'SELL', reason: 'Geopolitical risk and fuel costs threaten cruise operator margins.' },
];

const TODAY = '2026-04-06';

const BADGE_COLORS = { BUY: '#22c55e', SELL: '#ef4444', HOLD: '#eab308', WATCH: '#3b82f6' };

function parseDate(d) {
  const [y, m, day] = d.split('-').map(Number);
  return new Date(y, m - 1, day);
}

function daysBetween(a, b) {
  return Math.round((b - a) / 86400000);
}

function DailyMarketAnalysis() {
  const [selected, setSelected] = useState(null);

  const todayDate = parseDate(TODAY);
  const minDate = new Date(todayDate); minDate.setDate(minDate.getDate() - 3);
  const maxDate = new Date(todayDate); maxDate.setDate(maxDate.getDate() + 25);
  const totalDays = daysBetween(minDate, maxDate);

  const impactY = { High: 1, Medium: 2, Low: 3 };
  const chartW = 900, chartH = 300, pad = { top: 40, right: 30, bottom: 50, left: 70 };
  const plotW = chartW - pad.left - pad.right;
  const plotH = chartH - pad.top - pad.bottom;

  const xScale = (date) => pad.left + (daysBetween(minDate, parseDate(date)) / totalDays) * plotW;
  const yScale = (impact) => pad.top + ((impactY[impact] - 0.5) / 3) * plotH;

  const todayX = pad.left + (daysBetween(minDate, todayDate) / totalDays) * plotW;

  const ticks = useMemo(() => {
    const t = [];
    for (let i = 0; i <= totalDays; i += Math.max(1, Math.floor(totalDays / 8))) {
      const d = new Date(minDate); d.setDate(d.getDate() + i);
      const label = `${d.getMonth() + 1}/${d.getDate()}`;
      const x = pad.left + (i / totalDays) * plotW;
      t.push({ label, x });
    }
    return t;
  }, [totalDays]);

  const selectedEvent = EVENTS.find(e => e.id === selected);

  return (
    <div style={{ background: '#0b0f1a', minHeight: '100vh', color: '#e2e8f0', fontFamily: 'Inter, system-ui, sans-serif', padding: 24 }}>
      <h1 style={{ fontSize: 28, fontWeight: 700, marginBottom: 4 }}>Daily Market Analysis</h1>
      <p style={{ color: '#94a3b8', marginBottom: 24 }}>{TODAY} &mdash; 14 Key Events Across Tech, Healthcare, Energy &amp; Finance</p>

      {/* Legend */}
      <div style={{ display: 'flex', gap: 20, marginBottom: 16, flexWrap: 'wrap' }}>
        {Object.entries(INDUSTRY_COLORS).map(([name, color]) => (
          <span key={name} style={{ display: 'flex', alignItems: 'center', gap: 6, fontSize: 13 }}>
            <span style={{ width: 12, height: 12, borderRadius: '50%', background: color, display: 'inline-block' }} />
            {name}
          </span>
        ))}
      </div>

      {/* Chart */}
      <div style={{ background: '#151c2c', borderRadius: 12, padding: 20, marginBottom: 24, overflowX: 'auto' }}>
        <svg width={chartW} height={chartH} style={{ display: 'block', margin: '0 auto' }}>
          {/* Past bg */}
          <rect x={pad.left} y={pad.top} width={Math.max(0, todayX - pad.left)} height={plotH} fill="rgba(239,68,68,0.06)" />
          {/* Future bg */}
          <rect x={todayX} y={pad.top} width={Math.max(0, pad.left + plotW - todayX)} height={plotH} fill="rgba(34,197,94,0.06)" />

          {/* Grid lines */}
          {['High', 'Medium', 'Low'].map((label, i) => {
            const y = yScale(label);
            return (
              <g key={label}>
                <line x1={pad.left} x2={pad.left + plotW} y1={y} y2={y} stroke="#1e293b" />
                <text x={pad.left - 10} y={y + 4} textAnchor="end" fill="#64748b" fontSize={12}>{label}</text>
              </g>
            );
          })}

          {/* X-axis ticks */}
          {ticks.map((t, i) => (
            <text key={i} x={t.x} y={chartH - 10} textAnchor="middle" fill="#64748b" fontSize={11}>{t.label}</text>
          ))}

          {/* Today line */}
          <line x1={todayX} x2={todayX} y1={pad.top} y2={pad.top + plotH} stroke="#ef4444" strokeWidth={2} strokeDasharray="6 4" />
          <text x={todayX} y={pad.top - 8} textAnchor="middle" fill="#ef4444" fontSize={11} fontWeight={600}>TODAY</text>

          {/* Event dots */}
          {EVENTS.map(evt => {
            const cx = xScale(evt.date);
            const cy = yScale(evt.impact);
            const isSelected = selected === evt.id;
            return (
              <circle
                key={evt.id}
                cx={cx} cy={cy} r={isSelected ? 9 : 7}
                fill={INDUSTRY_COLORS[evt.industry]}
                stroke={isSelected ? '#fff' : 'none'}
                strokeWidth={2}
                opacity={0.9}
                style={{ cursor: 'pointer', transition: 'r 0.2s' }}
                onClick={() => setSelected(isSelected ? null : evt.id)}
              />
            );
          })}
        </svg>
      </div>

      {/* Detail panel */}
      {selectedEvent && (
        <div style={{ background: '#151c2c', borderRadius: 12, padding: 20, marginBottom: 24, border: `1px solid ${INDUSTRY_COLORS[selectedEvent.industry]}44` }}>
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', flexWrap: 'wrap', gap: 12 }}>
            <div>
              <h3 style={{ fontSize: 18, margin: 0 }}>{selectedEvent.headline}</h3>
              <p style={{ color: '#94a3b8', margin: '8px 0 0' }}>
                <strong>{selectedEvent.ticker}</strong> &middot; {selectedEvent.industry} &middot; {selectedEvent.date} &middot; Impact: {selectedEvent.impact}
              </p>
            </div>
            <span style={{
              background: BADGE_COLORS[selectedEvent.recommendation],
              color: selectedEvent.recommendation === 'HOLD' ? '#000' : '#fff',
              padding: '6px 16px', borderRadius: 999, fontWeight: 700, fontSize: 14, whiteSpace: 'nowrap'
            }}>
              {selectedEvent.recommendation}
            </span>
          </div>
          <p style={{ marginTop: 12, color: '#cbd5e1', lineHeight: 1.5 }}>{selectedEvent.reason}</p>
        </div>
      )}

      {/* Table */}
      <div style={{ background: '#151c2c', borderRadius: 12, padding: 20, overflowX: 'auto' }}>
        <h2 style={{ fontSize: 18, marginBottom: 16 }}>All Events</h2>
        <table style={{ width: '100%', borderCollapse: 'collapse', fontSize: 14 }}>
          <thead>
            <tr style={{ borderBottom: '1px solid #1e293b', textAlign: 'left' }}>
              <th style={{ padding: '8px 12px', color: '#94a3b8' }}>Date</th>
              <th style={{ padding: '8px 12px', color: '#94a3b8' }}>Ticker</th>
              <th style={{ padding: '8px 12px', color: '#94a3b8' }}>Headline</th>
              <th style={{ padding: '8px 12px', color: '#94a3b8' }}>Industry</th>
              <th style={{ padding: '8px 12px', color: '#94a3b8' }}>Impact</th>
              <th style={{ padding: '8px 12px', color: '#94a3b8' }}>Action</th>
            </tr>
          </thead>
          <tbody>
            {EVENTS.map(evt => (
              <tr key={evt.id} style={{ borderBottom: '1px solid #1e293b11', cursor: 'pointer' }} onClick={() => setSelected(evt.id)}>
                <td style={{ padding: '8px 12px' }}>{evt.date}</td>
                <td style={{ padding: '8px 12px', fontWeight: 600 }}>{evt.ticker}</td>
                <td style={{ padding: '8px 12px' }}>{evt.headline}</td>
                <td style={{ padding: '8px 12px' }}>
                  <span style={{ color: INDUSTRY_COLORS[evt.industry] }}>{evt.industry}</span>
                </td>
                <td style={{ padding: '8px 12px' }}>{evt.impact}</td>
                <td style={{ padding: '8px 12px' }}>
                  <span style={{
                    background: BADGE_COLORS[evt.recommendation],
                    color: evt.recommendation === 'HOLD' ? '#000' : '#fff',
                    padding: '2px 10px', borderRadius: 999, fontSize: 12, fontWeight: 700
                  }}>
                    {evt.recommendation}
                  </span>
                </td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>

      <p style={{ color: '#475569', fontSize: 12, marginTop: 24, textAlign: 'center' }}>
        Sources: CNBC, TheStreet, Bloomberg, Yahoo Finance, Earnings Whispers &mdash; Generated {TODAY}
      </p>
    </div>
  );
}




ReactDOM.createRoot(document.getElementById("root")).render(<DailyMarketAnalysis />);
</script>
<script>
  (function () {
    // Libraries are loaded here rather than with blocking <script src> tags: a stalled
    // CDN request (common on mobile) used to leave the page on "Loading..." forever.
    // Each library gets a timeout and falls back to another CDN; if all fail, a Retry button shows.
    var CDNS = ["https://cdn.jsdelivr.net/npm/", "https://unpkg.com/", "https://cdn.jsdelivr.net/npm/"];
    var LIB = {
      react: "react@18.3.1/umd/react.production.min.js",
      dom:   "react-dom@18.3.1/umd/react-dom.production.min.js",
      babel: "@babel/standalone@7.24.7/babel.min.js"
    };
    var root = document.getElementById("root");
    var dead = false;

    function status(msg) { var b = root.querySelector(".boot"); if (b) b.textContent = msg; }
    function fail(msg) {
      if (dead) return; dead = true;
      root.innerHTML = '<div class="err"></div><div class="boot"><button class="retry">Retry</button></div>';
      root.querySelector(".err").textContent = msg;
      root.querySelector(".retry").onclick = function () { location.reload(); };
    }

    function load(path, globalName, timeoutMs, done) {
      var attempt = 0, finished = false;
      function next() {
        if (dead || finished) return;
        if (attempt >= CDNS.length) {
          finished = true;
          done(new Error("Could not load " + path + " — the connection is too slow or blocked."));
          return;
        }
        if (attempt > 0) status("Slow connection — retrying from a backup server…");
        var settled = false, s = document.createElement("script");
        var timer = setTimeout(function () { settle(false); }, timeoutMs);
        function settle(ok) {
          if (settled || finished) return;
          settled = true; clearTimeout(timer); s.onload = s.onerror = null;
          if (ok && window[globalName]) { finished = true; done(null); } else next();
        }
        s.onload = function () { settle(true); };
        s.onerror = function () { settle(false); };
        s.src = CDNS[attempt++] + path;
        document.head.appendChild(s);
      }
      next();
    }

    var R, RD, B, pending = 2;
    function ready(err) {
      if (err) { fail(err.message); return; }
      if (--pending === 0) boot();
    }
    function boot() {
      try {
        var src = document.getElementById("jsx-source").textContent;
        var out = B.transform(src, { presets: [["react", { runtime: "classic" }]] }).code;
        new Function("React", "ReactDOM", out)(R, RD);
      } catch (e) {
        fail("Render error: " + (e && e.message ? e.message : e));
        console.error(e);
      }
    }
    window.addEventListener("error", function (e) {
      if (root.querySelector(".boot") && !root.querySelector(".retry")) fail("Render error: " + e.message);
    });

    load(LIB.react, "React", 10000, function (err) {
      if (err) return ready(err);
      load(LIB.dom, "ReactDOM", 10000, function (err2) {
        // Capture the React instance ReactDOM bound to, so a late duplicate download can't split them.
        if (!err2) { R = window.React; RD = window.ReactDOM; }
        ready(err2);
      });
    });
    load(LIB.babel, "Babel", 20000, function (err) {
      if (!err) B = window.Babel;
      ready(err);
    });
  })();
</script>
</body>
